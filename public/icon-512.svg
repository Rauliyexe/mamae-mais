<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28EB5" />
      <stop offset="100%" stop-color="#D4638F" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6B2D4E" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle / Background -->
  <rect width="512" height="512" rx="116" fill="url(#roseGrad512)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5" />
  
  <!-- Icon Group with Shadow -->
  <g filter="url(#shadow512)" transform="translate(64, 52)">
    <!-- Pregnant Mother & Heart Silhouette -->
    <!-- Head -->
    <circle cx="160" cy="85" r="42" fill="#FFFFFF" />
    
    <!-- Body & Back -->
    <path d="M 117,138 C 90,160 80,202 85,256 C 88,288 101,325 138,352 C 160,368 192,373 218,362 C 186,336 176,298 176,261 C 176,213 192,186 181,144 C 165,128 138,128 117,138 Z" fill="#FFFFFF" />
    
    <!-- Pregnant Belly Curve -->
    <path d="M 181,170 C 224,176 266,218 261,277 C 256,325 218,357 181,362 C 213,352 234,314 234,272 C 234,229 207,192 181,170 Z" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Plus badge in soft gradient -->
    <g transform="translate(180, 202)">
      <circle cx="90" cy="55" r="48" fill="#FFFFFF" />
      <path d="M 90,28 L 90,82 M 63,55 L 117,55" stroke="#D4638F" stroke-width="13" stroke-linecap="round" />
    </g>
  </g>
</svg>
