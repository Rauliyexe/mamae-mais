<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="roseGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28EB5" />
      <stop offset="100%" stop-color="#D4638F" />
    </linearGradient>
    <filter id="shadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B2D4E" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle / Background -->
  <rect width="192" height="192" rx="44" fill="url(#roseGrad192)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="6" y="6" width="180" height="180" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Icon Group with Shadow -->
  <g filter="url(#shadow192)" transform="translate(24, 20)">
    <!-- Pregnant Mother & Heart Silhouette -->
    <!-- Head -->
    <circle cx="60" cy="32" r="16" fill="#FFFFFF" />
    
    <!-- Body & Belly Shape -->
    <path d="M 44,52 C 34,60 30,76 32,96 C 33,108 38,122 52,132 C 60,138 72,140 82,136 C 70,126 66,112 66,98 C 66,80 72,70 68,54 C 62,48 52,48 44,52 Z" fill="#FFFFFF" />
    
    <!-- Beautiful Pregnant Belly Curve -->
    <path d="M 68,64 C 84,66 100,82 98,104 C 96,122 82,134 68,136 C 80,132 88,118 88,102 C 88,86 78,72 68,64 Z" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Heart in the Womb / Plus Sign -->
    <g transform="translate(68, 76)">
      <!-- Plus badge -->
      <circle cx="34" cy="20" r="18" fill="#FFFFFF" />
      <path d="M 34,10 L 34,30 M 24,20 L 44,20" stroke="#D4638F" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
